<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WARC — Instagram Content Pack</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages: GitHub Pages has no server-side
      // rewrite rule, so a direct visit or refresh on a client-side route
      // (e.g. /outreach) 404s. This encodes the path into a query string and
      // bounces to index.html, which decodes it back (see index.html).
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 1 // keep the /warc-instagram-posts/ repo segment

      var l = window.location
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
